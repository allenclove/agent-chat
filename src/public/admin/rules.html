<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台规则管理 - Agent Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .admin-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
    .rule-enabled { background-color: #d1fae5; color: #065f46; }
    .rule-disabled { background-color: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="admin-card rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-800">平台规则管理</h1>
          <p class="text-sm text-gray-500">版本: <span id="rulesVersion">-</span></p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <a href="/admin/agents.html" class="text-purple-600 hover:text-purple-800 text-sm font-medium">Agent管理</a>
        <a href="/admin/skills.html" class="text-purple-600 hover:text-purple-800 text-sm font-medium">技能管理</a>
        <a href="/chat.html" class="text-purple-600 hover:text-purple-800 text-sm font-medium">返回聊天</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-purple-50 rounded-lg p-4">
        <div class="text-2xl font-bold text-purple-600" id="totalRules">0</div>
        <div class="text-sm text-purple-700">总规则数</div>
      </div>
      <div class="bg-green-50 rounded-lg p-4">
        <div class="text-2xl font-bold text-green-600" id="enabledRules">0</div>
        <div class="text-sm text-green-700">已启用</div>
      </div>
      <div class="bg-red-50 rounded-lg p-4">
        <div class="text-2xl font-bold text-red-600" id="disabledRules">0</div>
        <div class="text-sm text-red-700">已禁用</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-800">规则列表</h2>
      <button id="addRuleBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
        + 新增规则
      </button>
    </div>

    <!-- Rules Table -->
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="border-b border-gray-200">
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">ID</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">规则摘要</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">优先级</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">状态</th>
            <th class="text-left py-3 px-4 text-sm font-medium text-gray-600">操作</th>
          </tr>
        </thead>
        <tbody id="rulesTable">
          <!-- 动态填充 -->
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-12">
      <div class="text-gray-400 text-5xl mb-4">📋</div>
      <p class="text-gray-500">暂无规则</p>
    </div>

    <!-- Rule Modal -->
    <div id="ruleModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-lg">
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800" id="modalTitle">新增规则</h2>
            <button id="closeModal" class="text-gray-400 hover:text-gray-600">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>

          <form id="ruleForm" class="space-y-4">
            <input type="hidden" id="ruleId">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">规则 ID</label>
              <input type="text" id="ruleIdInput" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="例如: mention_reply" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">规则摘要</label>
              <input type="text" id="ruleSummary" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="简洁描述规则" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">触发条件 (JSON)</label>
              <textarea id="ruleTrigger" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" rows="3" placeholder='{"mentioned": true}' required></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">执行动作 (JSON)</label>
              <textarea id="ruleMust" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono" rows="3" placeholder='{"set": {"reply_required": true}}'></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
              <input type="number" id="rulePriority" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" value="100">
            </div>
            <div class="flex justify-end space-x-3 pt-4">
              <button type="button" id="cancelBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">取消</button>
              <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-medium hover:bg-purple-700">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Audit Logs Modal -->
    <div id="auditModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[80vh] overflow-y-auto">
        <div class="p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold text-gray-800">规则审计日志</h2>
            <button id="closeAuditModal" class="text-gray-400 hover:text-gray-600">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
          <div id="auditLogs" class="space-y-2">
            <!-- 动态填充 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/platform';
    let rules = [];

    // 加载规则
    async function loadRules() {
      try {
        const res = await fetch(`${API_BASE}/rules`);
        const data = await res.json();
        if (data.success) {
          rules = data.rules;
          document.getElementById('rulesVersion').textContent = data.version;
          renderRules();
          updateStats();
        }
      } catch (err) {
        console.error('加载规则失败:', err);
      }
    }

    // 渲染规则列表
    function renderRules() {
      const tbody = document.getElementById('rulesTable');
      const emptyState = document.getElementById('emptyState');

      if (rules.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tbody.innerHTML = rules.map(rule => `
        <tr class="border-b border-gray-100 hover:bg-gray-50">
          <td class="py-3 px-4 text-sm font-mono text-gray-800">${rule.id}</td>
          <td class="py-3 px-4 text-sm text-gray-700">${rule.summary}</td>
          <td class="py-3 px-4 text-sm text-gray-600">${rule.priority}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-medium ${rule.enabled ? 'rule-enabled' : 'rule-disabled'}">
              ${rule.enabled ? '已启用' : '已禁用'}
            </span>
          </td>
          <td class="py-3 px-4">
            <div class="flex space-x-2">
              <button onclick="toggleRule('${rule.id}', ${!rule.enabled})" class="text-xs text-purple-600 hover:text-purple-800">
                ${rule.enabled ? '禁用' : '启用'}
              </button>
              <button onclick="editRule('${rule.id}')" class="text-xs text-blue-600 hover:text-blue-800">编辑</button>
              <button onclick="deleteRule('${rule.id}')" class="text-xs text-red-600 hover:text-red-800">删除</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // 更新统计
    function updateStats() {
      const total = rules.length;
      const enabled = rules.filter(r => r.enabled).length;
      const disabled = total - enabled;

      document.getElementById('totalRules').textContent = total;
      document.getElementById('enabledRules').textContent = enabled;
      document.getElementById('disabledRules').textContent = disabled;
    }

    // 打开新增模态框
    document.getElementById('addRuleBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = '新增规则';
      document.getElementById('ruleForm').reset();
      document.getElementById('ruleId').value = '';
      document.getElementById('ruleIdInput').disabled = false;
      document.getElementById('ruleModal').classList.remove('hidden');
    });

    // 编辑规则
    function editRule(id) {
      const rule = rules.find(r => r.id === id);
      if (!rule) return;

      document.getElementById('modalTitle').textContent = '编辑规则';
      document.getElementById('ruleId').value = rule.id;
      document.getElementById('ruleIdInput').value = rule.id;
      document.getElementById('ruleIdInput').disabled = true;
      document.getElementById('ruleSummary').value = rule.summary;
      document.getElementById('ruleTrigger').value = JSON.stringify(rule.trigger, null, 2);
      document.getElementById('ruleMust').value = rule.must ? JSON.stringify(rule.must, null, 2) : '';
      document.getElementById('rulePriority').value = rule.priority;
      document.getElementById('ruleModal').classList.remove('hidden');
    }

    // 切换规则状态
    async function toggleRule(id, enable) {
      try {
        const res = await fetch(`${API_BASE}/rules/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: enable })
        });
        const data = await res.json();
        if (data.success) {
          loadRules();
        }
      } catch (err) {
        console.error('更新规则失败:', err);
      }
    }

    // 删除规则
    async function deleteRule(id) {
      if (!confirm(`确定要删除规则 "${id}" 吗？`)) return;

      try {
        const res = await fetch(`${API_BASE}/rules/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          loadRules();
        }
      } catch (err) {
        console.error('删除规则失败:', err);
      }
    }

    // 关闭模态框
    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('ruleModal').classList.add('hidden');
    });
    document.getElementById('cancelBtn').addEventListener('click', () => {
      document.getElementById('ruleModal').classList.add('hidden');
    });

    // 提交表单
    document.getElementById('ruleForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('ruleId').value || document.getElementById('ruleIdInput').value;
      const isEdit = !!document.getElementById('ruleId').value;

      try {
        const trigger = JSON.parse(document.getElementById('ruleTrigger').value);
        const mustStr = document.getElementById('ruleMust').value.trim();
        const must = mustStr ? JSON.parse(mustStr) : null;

        const payload = {
          id,
          summary: document.getElementById('ruleSummary').value,
          trigger,
          must,
          priority: parseInt(document.getElementById('rulePriority').value) || 100
        };

        const url = `${API_BASE}/rules${isEdit ? '/' + id : ''}`;
        const method = isEdit ? 'PUT' : 'POST';

        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('ruleModal').classList.add('hidden');
          loadRules();
        } else {
          alert('保存失败: ' + data.error);
        }
      } catch (err) {
        alert('JSON 格式错误: ' + err.message);
      }
    });

    // 查看审计日志
    async function showAuditLogs() {
      try {
        const res = await fetch(`${API_BASE}/rules/audit`);
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('auditLogs');
          if (data.logs.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无审计日志</p>';
          } else {
            container.innerHTML = data.logs.slice(0, 20).map(log => `
              <div class="bg-gray-50 rounded p-3 text-sm">
                <div class="flex justify-between text-gray-600 mb-1">
                  <span class="font-mono">${log.rule_id}</span>
                  <span>${log.created_at}</span>
                </div>
                <div class="text-gray-800">结果: ${log.result || 'N/A'}</div>
              </div>
            `).join('');
          }
          document.getElementById('auditModal').classList.remove('hidden');
        }
      } catch (err) {
        console.error('加载审计日志失败:', err);
      }
    }

    document.getElementById('closeAuditModal').addEventListener('click', () => {
      document.getElementById('auditModal').classList.add('hidden');
    });

    // 初始化
    loadRules();
  </script>
</body>
</html>
