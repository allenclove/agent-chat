<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上下文监控 - Agent Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .admin-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
    .scene-active { background-color: #d1fae5; color: #065f46; }
    .scene-paused { background-color: #fef3c7; color: #92400e; }
    .scene-completed { background-color: #f3f4f6; color: #4b5563; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="admin-card rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-800">上下文监控</h1>
          <p class="text-sm text-gray-500">实时监控平台上下文和场景状态</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button id="refreshBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          刷新
        </button>
        <a href="/admin/packs.html" class="text-purple-600 hover:text-purple-800 text-sm font-medium">能力包</a>
        <a href="/chat.html" class="text-purple-600 hover:text-purple-800 text-sm font-medium">返回聊天</a>
      </div>
    </div>

    <!-- Global Context -->
    <div class="bg-gray-50 rounded-lg p-4 mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-3">全局上下文</h2>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white rounded p-3">
          <div class="text-sm text-gray-500">规则版本</div>
          <div class="text-lg font-semibold text-purple-600" id="rulesVersion">-</div>
        </div>
        <div class="bg-white rounded p-3">
          <div class="text-sm text-gray-500">可用能力包</div>
          <div class="text-lg font-semibold text-blue-600" id="availablePacks">-</div>
        </div>
        <div class="bg-white rounded p-3">
          <div class="text-sm text-gray-500">可用技能</div>
          <div class="text-lg font-semibold text-green-600" id="availableSkills">-</div>
        </div>
      </div>
    </div>

    <!-- Active Scenes -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold text-gray-800">活跃场景</h2>
        <span class="text-sm text-gray-500">共 <span id="sceneCount">0</span> 个活跃场景</span>
      </div>
      <div id="scenesList" class="space-y-3">
        <!-- 动态填充 -->
      </div>
      <div id="noScenes" class="hidden text-center py-8 text-gray-500">
        暂无活跃场景
      </div>
    </div>

    <!-- Scene Activation -->
    <div class="bg-gray-50 rounded-lg p-4 mb-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-3">激活新场景</h2>
      <div class="flex space-x-3">
        <select id="packSelect" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="">选择能力包...</option>
        </select>
        <input type="text" id="participants" class="w-64 border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="参与者ID (逗号分隔)">
        <button id="activateBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          激活场景
        </button>
      </div>
    </div>

    <!-- JSON Viewer -->
    <div>
      <h2 class="text-lg font-semibold text-gray-800 mb-3">上下文 JSON</h2>
      <div class="bg-gray-900 rounded-lg p-4 overflow-auto max-h-96">
        <pre id="contextJson" class="text-green-400 text-sm font-mono">{}</pre>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/platform';

    // 加载上下文
    async function loadContext() {
      try {
        const res = await fetch(`${API_BASE}/context`);
        const data = await res.json();
        if (data.success) {
          const ctx = data.context;
          document.getElementById('rulesVersion').textContent = ctx.rules_version || '-';
          document.getElementById('availablePacks').textContent = (ctx.available_packs || []).length;
          document.getElementById('availableSkills').textContent = (ctx.available_skills || []).length;
          document.getElementById('contextJson').textContent = JSON.stringify(ctx, null, 2);
        }
      } catch (err) {
        console.error('加载上下文失败:', err);
      }
    }

    // 加载活跃场景
    async function loadScenes() {
      try {
        const res = await fetch(`${API_BASE}/scenes`);
        const data = await res.json();
        if (data.success) {
          const scenes = data.scenes;
          document.getElementById('sceneCount').textContent = scenes.length;

          const list = document.getElementById('scenesList');
          const noScenes = document.getElementById('noScenes');

          if (scenes.length === 0) {
            list.innerHTML = '';
            noScenes.classList.remove('hidden');
            return;
          }

          noScenes.classList.add('hidden');
          list.innerHTML = scenes.map(scene => `
            <div class="bg-white border border-gray-200 rounded-lg p-4">
              <div class="flex items-center justify-between">
                <div>
                  <div class="flex items-center space-x-2">
                    <h3 class="font-semibold text-gray-800">${scene.pack_name}</h3>
                    <span class="scene-${scene.status} px-2 py-0.5 rounded text-xs font-medium">${scene.status}</span>
                  </div>
                  <div class="text-sm text-gray-500 mt-1">
                    场景ID: <span class="font-mono">${scene.scene_id}</span> | 能力包: ${scene.pack_id}
                  </div>
                  <div class="text-sm text-gray-500">
                    参与者: ${(scene.participants || []).join(', ') || '无'}
                  </div>
                </div>
                <div class="flex space-x-2">
                  <button onclick="viewScene('${scene.scene_id}')" class="text-xs text-blue-600 hover:text-blue-800">查看</button>
                  <button onclick="endScene('${scene.scene_id}')" class="text-xs text-red-600 hover:text-red-800">结束</button>
                </div>
              </div>
              <div class="text-xs text-gray-400 mt-2">创建于: ${scene.created_at}</div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('加载场景失败:', err);
      }
    }

    // 加载能力包列表
    async function loadPacks() {
      try {
        const res = await fetch(`${API_BASE}/packs`);
        const data = await res.json();
        if (data.success) {
          const select = document.getElementById('packSelect');
          select.innerHTML = '<option value="">选择能力包...</option>' +
            data.packs.filter(p => p.enabled).map(p =>
              `<option value="${p.id}">${p.name} (${p.id})</option>`
            ).join('');
        }
      } catch (err) {
        console.error('加载能力包失败:', err);
      }
    }

    // 激活场景
    document.getElementById('activateBtn').addEventListener('click', async () => {
      const packId = document.getElementById('packSelect').value;
      if (!packId) {
        alert('请选择能力包');
        return;
      }

      const participantsStr = document.getElementById('participants').value.trim();
      const participants = participantsStr ? participantsStr.split(',').map(s => s.trim()) : [];

      try {
        const res = await fetch(`${API_BASE}/scenes/activate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pack_id: packId, participants })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('participants').value = '';
          loadScenes();
          alert('场景已激活: ' + data.scene.scene_id);
        } else {
          alert('激活失败: ' + data.error);
        }
      } catch (err) {
        alert('激活失败: ' + err.message);
      }
    });

    // 查看场景详情
    async function viewScene(sceneId) {
      try {
        const res = await fetch(`${API_BASE}/scenes/${sceneId}`);
        const data = await res.json();
        if (data.success) {
          alert(JSON.stringify(data.scene, null, 2));
        }
      } catch (err) {
        console.error('获取场景失败:', err);
      }
    }

    // 结束场景
    async function endScene(sceneId) {
      if (!confirm('确定要结束此场景吗？')) return;

      try {
        const res = await fetch(`${API_BASE}/scenes/${sceneId}/end`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: 'manual' })
        });
        const data = await res.json();
        if (data.success) {
          loadScenes();
        }
      } catch (err) {
        console.error('结束场景失败:', err);
      }
    }

    // 刷新
    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadContext();
      loadScenes();
      loadPacks();
    });

    // 初始化
    loadContext();
    loadScenes();
    loadPacks();

    // 自动刷新
    setInterval(() => {
      loadContext();
      loadScenes();
    }, 10000);
  </script>
</body>
</html>
