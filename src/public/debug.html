<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息诊断 - Agent Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .msg-row { transition: all 0.15s; cursor: pointer; }
    .msg-row:hover { background: #1e293b; }
    .msg-row.selected { background: #1e3a5f; border-left: 3px solid #3b82f6; }
    .event-item { border-left: 2px solid #334155; padding-left: 12px; position: relative; }
    .event-dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; left: -5px; top: 6px; }
    .no-trace { color: #475569; cursor: default; }
    .no-trace:hover { background: transparent; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="flex h-screen">
  <!-- 左侧：消息列表 -->
  <aside class="w-80 md:w-96 bg-gray-900 border-r border-gray-800 flex flex-col flex-shrink-0">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-base">🔍 消息诊断</h1>
        <div class="flex items-center gap-2 mt-1">
          <span id="recordingDot" class="w-2 h-2 rounded-full bg-gray-600"></span>
          <span id="recordingText" class="text-xs text-gray-500">未连接</span>
        </div>
      </div>
      <a href="/chat.html" class="text-xs text-blue-400 hover:text-blue-300">返回聊天</a>
    </div>
    <div id="messageList" class="flex-1 overflow-y-auto">
      <p class="text-center text-gray-500 py-12 text-sm">等待连接...</p>
    </div>
  </aside>

  <!-- 右侧：诊断链 -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div id="emptyDetail" class="flex-1 flex items-center justify-center text-gray-600">
      <div class="text-center">
        <div class="text-4xl mb-3">🔍</div>
        <p>点击左侧消息查看诊断链</p>
        <p class="text-xs mt-2 text-gray-700">带 <span class="text-blue-400">🔗</span> 标记的消息有完整诊断数据</p>
      </div>
    </div>
    <div id="traceDetail" class="hidden flex-1 flex flex-col overflow-hidden">
      <div class="p-4 border-b border-gray-800 flex items-center justify-between">
        <div>
          <span class="font-mono text-sm text-blue-400" id="detailTraceId"></span>
          <span class="text-xs text-gray-500 ml-3" id="detailMsgInfo"></span>
        </div>
        <span class="text-xs text-gray-500" id="detailDuration"></span>
      </div>
      <div id="eventTimeline" class="flex-1 overflow-y-auto p-4 space-y-1"></div>
    </div>
  </main>

  <script>
    let ws = null;
    let messages = [];
    let selectedMsgId = null;

    const EVENT_LABELS = {
      message_created:      { icon: '📝', label: '消息创建', color: '#60a5fa' },
      server_received:      { icon: '📥', label: '服务端接收', color: '#22d3ee' },
      server_broadcast:     { icon: '📢', label: '广播', color: '#818cf8' },
      server_forward_agent: { icon: '➡️', label: '转发Agent', color: '#f472b6' },
      rules_evaluated:      { icon: '✅', label: '规则匹配', color: '#34d399' },
      packs_detected:       { icon: '📦', label: '能力包触发', color: '#fbbf24' },
      context_injected:     { icon: '💉', label: '上下文注入', color: '#c084fc' },
      message:              { icon: '💬', label: '消息事件', color: '#94a3b8' }
    };

    // ==================== WebSocket ====================

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        setRecording('已连接 · 等待录制', 'bg-yellow-500');
        ws.send(JSON.stringify({ type: 'debug_join', payload: {} }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleMsg(data);
        } catch (e) {}
      };

      ws.onclose = () => {
        setRecording('已断开', 'bg-gray-600');
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {};
    }

    function handleMsg(data) {
      const { type, payload } = data;

      switch (type) {
        case 'debug_join_ack':
          setRecording('录制中', 'bg-green-500');
          break;

        case 'debug_messages':
          if (payload.messages) {
            messages = payload.messages.reverse(); // 旧→新
            renderMessageList();
          }
          break;

        case 'message':
          // 新消息到达
          const traceId = payload.trace_id || null;
          messages.push({ ...payload, trace_id: traceId });
          if (messages.length > 200) messages.shift();
          renderMessageList();
          break;

        case 'agent_list':
          break;

        case 'user_list':
          break;
      }
    }

    function setRecording(text, dotClass) {
      document.getElementById('recordingText').textContent = text;
      const dot = document.getElementById('recordingDot');
      dot.className = `w-2 h-2 rounded-full mr-2 ${dotClass}`;
    }

    // ==================== 消息列表 ====================

    function renderMessageList() {
      const container = document.getElementById('messageList');
      if (messages.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-12 text-sm">暂无消息</p>';
        return;
      }

      container.innerHTML = messages.map((m, idx) => {
        const isAgent = m.sender_type === 'agent';
        const hasTrace = !!m.trace_id;
        const selected = selectedMsgId === String(m.id) ? 'selected' : '';
        const clickable = hasTrace ? '' : 'no-trace';
        const icon = isAgent ? '🤖' : m.sender_type === 'system' ? '🔧' : '👤';
        const time = fmtTime(m.created_at);

        return `
          <div class="msg-row px-4 py-2.5 border-b border-gray-800/50 ${selected} ${clickable}"
               ${hasTrace ? `onclick="selectMessage('${m.id}')"` : ''}
               data-id="${m.id}">
            <div class="flex items-center justify-between">
              <span class="text-sm">
                ${hasTrace ? '<span class="text-blue-400 text-xs mr-1">🔗</span>' : '<span class="text-gray-700 text-xs mr-1">·</span>'}
                ${icon} <span class="${isAgent ? 'text-purple-300' : 'text-gray-300'}">${escHtml(m.sender_name)}</span>
              </span>
              <span class="text-xs text-gray-600">${time}</span>
            </div>
            <div class="text-xs text-gray-500 mt-0.5 truncate">${escHtml(m.content).substring(0, 60)}</div>
          </div>
        `;
      }).join('');
    }

    function selectMessage(msgId) {
      selectedMsgId = String(msgId);
      renderMessageList();
      loadTraceDetail(msgId);
    }

    // ==================== 诊断链 ====================

    async function loadTraceDetail(msgId) {
      const msg = messages.find(m => String(m.id) === String(msgId));
      if (!msg?.trace_id) return;

      document.getElementById('emptyDetail').classList.add('hidden');
      document.getElementById('traceDetail').classList.remove('hidden');
      document.getElementById('detailTraceId').textContent = '📋 ' + msg.trace_id;
      document.getElementById('detailMsgInfo').textContent =
        `${msg.sender_type === 'agent' ? '🤖' : '👤'} ${msg.sender_name} · ${msg.content.substring(0, 40)}`;

      try {
        const res = await fetch(`/api/debug/traces/${msg.trace_id}`);
        const data = await res.json();
        if (data.success && data.trace) {
          renderTimeline(data.trace);
        }
      } catch (e) {
        document.getElementById('eventTimeline').innerHTML =
          '<p class="text-red-400 text-sm p-4">加载失败</p>';
      }
    }

    function renderTimeline(trace) {
      const container = document.getElementById('eventTimeline');
      const events = trace.events || [];

      if (events.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm p-4">暂无事件记录</p>';
        document.getElementById('detailDuration').textContent = '';
        return;
      }

      let prevTs = trace.created_at;
      const totalMs = events.length > 0 ? events[events.length - 1].timestamp - trace.created_at : 0;
      document.getElementById('detailDuration').textContent = `总耗时: ${totalMs}ms`;

      container.innerHTML = events.map((e, i) => {
        const info = EVENT_LABELS[e.type] || { icon: '📌', label: e.type, color: '#94a3b8' };
        const delta = e.timestamp - prevTs;
        prevTs = e.timestamp;
        const deltaStr = i === 0 ? 'start' : `+${delta}ms`;

        let detailHtml = '';
        if (e.type === 'rules_evaluated' && e.details?.matched) {
          detailHtml = e.details.matched.map(r =>
            `<span class="text-green-400">${r.rule}</span> → <span class="text-gray-400">${r.agent}</span>`
          ).join('<br>');
        } else if (e.type === 'context_injected' && e.details) {
          const d = e.details;
          const tags = [];
          if (d.mentioned) tags.push('<span class="text-yellow-400">@mentioned</span>');
          if (d.reply_required) tags.push('<span class="text-red-400">reply_required</span>');
          if (d.current_scene) tags.push(`<span class="text-cyan-400">scene:${d.current_scene}</span>`);
          const lockKeys = Object.keys(d.locks || {});
          if (lockKeys.length > 0) tags.push(`<span class="text-orange-400">locks:${lockKeys.join(',')}</span>`);
          const cdKeys = Object.keys(d.cooldowns || {});
          if (cdKeys.length > 0) tags.push(`<span class="text-purple-400">cooldowns:${cdKeys.join(',')}</span>`);
          detailHtml = `<span class="text-gray-400">→ ${d.agent_id}</span> ${tags.join(' ')}`;
        } else if (e.type === 'packs_detected' && e.details) {
          detailHtml = `<span class="text-yellow-400">${e.details.pack_name}</span> (${e.details.pack_id})`;
        } else if (e.type === 'server_forward_agent' && e.details) {
          detailHtml = `<span class="text-gray-400">→ ${e.details.agent_count || 0} 个Agent</span>`;
        } else if (e.details && Object.keys(e.details).length > 0) {
          detailHtml = `<pre class="text-gray-500 text-xs mt-1">${escHtml(JSON.stringify(e.details, null, 2))}</pre>`;
        }

        return `
          <div class="event-item py-1.5">
            <div class="event-dot" style="background:${info.color}"></div>
            <div class="flex items-center justify-between">
              <span class="text-sm">${info.icon} ${info.label} ${detailHtml}</span>
              <span class="text-xs text-gray-600 ml-2 flex-shrink-0">${deltaStr}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==================== 工具 ====================

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = String(s || '');
      return d.innerHTML;
    }

    function fmtTime(s) {
      if (!s) return '';
      const parts = s.split(' ');
      return (parts[1] || '').substring(0, 5);
    }

    // ==================== 启动 ====================

    connect();
  </script>
</body>
</html>
