<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Chat - 可观测性控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .log-entry { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.5; }
    .log-info { color: #60a5fa; }
    .log-success { color: #4ade80; }
    .log-warning { color: #fbbf24; }
    .log-error { color: #f87171; }
    .log-agent { color: #c084fc; }
    .log-user { color: #38bdf8; }
    .log-ws { color: #fb7185; }
    .log-system { color: #94a3b8; }
    .message-bubble { max-width: 100%; word-break: break-word; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .timeline-item { border-left: 2px solid #4b5563; padding-left: 12px; margin-left: 8px; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; left: -5px; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0; }
    .trace-item { transition: all 0.2s; }
    .trace-item:hover { background-color: #374151; }
    .event-timeline { border-left: 2px solid #4b5563; }
    .event-dot { width: 6px; height: 6px; border-radius: 50%; }
    .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="container mx-auto p-4 max-w-7xl">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <div>
        <h1 class="text-xl font-bold">🔍 Agent Chat 可观测性控制台</h1>
        <p class="text-xs text-gray-500">实时追踪消息生命周期</p>
      </div>
      <div class="flex items-center space-x-2">
        <span id="connectionIndicator" class="flex items-center text-sm">
          <span class="w-2 h-2 rounded-full bg-gray-500 mr-2"></span>
          <span id="connectionText">未连接</span>
        </span>
        <a href="/chat.html" class="px-3 py-1 bg-gray-700 rounded hover:bg-gray-600 text-sm">返回聊天</a>
      </div>
    </div>

    <!-- 主布局 -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <!-- 左侧：Agent 状态 + 操作 -->
      <div class="lg:col-span-1 space-y-4">
        <!-- Agent 状态卡片 -->
        <div class="bg-gray-800 rounded-lg p-4">
          <h2 class="font-semibold mb-3 flex items-center justify-between">
            <span>🤖 Agent 状态</span>
            <button id="refreshAgents" class="text-xs px-2 py-1 bg-gray-700 rounded hover:bg-gray-600">刷新</button>
          </h2>
          <div id="agentList" class="space-y-2 text-sm">
            <p class="text-gray-500">加载中...</p>
          </div>
        </div>

        <!-- 追踪统计 -->
        <div class="bg-gray-800 rounded-lg p-4">
          <h2 class="font-semibold mb-3">📊 追踪统计</h2>
          <div class="space-y-1 text-sm">
            <div class="flex justify-between"><span class="text-gray-400">追踪记录:</span><span id="traceCount">0</span></div>
            <div class="flex justify-between"><span class="text-gray-400">总消息:</span><span id="totalMsgCount">0</span></div>
            <div class="flex justify-between"><span class="text-gray-400">用户消息:</span><span id="humanMsgCount">0</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Agent消息:</span><span id="agentMsgCount">0</span></div>
            <div class="flex justify-between"><span class="text-gray-400">本次会话消息:</span><span id="sessionMsgCount">0</span></div>
          </div>
        </div>

        <!-- 快速操作 -->
        <div class="bg-gray-800 rounded-lg p-4">
          <h2 class="font-semibold mb-3">⚡ 操作</h2>
          <div class="space-y-2">
            <input id="testInput" type="text" placeholder="输入测试消息..."
              class="w-full px-3 py-2 bg-gray-700 rounded text-sm" autocomplete="off">
            <button id="sendTest" class="w-full px-3 py-2 bg-blue-600 rounded hover:bg-blue-500 text-sm">
              📤 发送测试消息
            </button>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <button id="testHello" class="px-2 py-1 bg-gray-700 rounded hover:bg-gray-600">"你好"</button>
              <button id="testPing" class="px-2 py-1 bg-gray-700 rounded hover:bg-gray-600">"ping"</button>
            </div>
            <hr class="border-gray-700">
            <button id="clearTraces" class="w-full px-3 py-2 bg-yellow-600 rounded hover:bg-yellow-500 text-sm">
              🗑️ 清空追踪记录
            </button>
            <button id="reconnect" class="w-full px-3 py-2 bg-gray-700 rounded hover:bg-gray-600 text-sm">
              🔄 重新连接
            </button>
          </div>
        </div>
      </div>

      <!-- 中间：标签页内容 -->
      <div class="lg:col-span-2 bg-gray-800 rounded-lg p-4">
        <!-- 标签页切换 -->
        <div class="flex border-b border-gray-700 mb-3">
          <button class="tab-btn px-4 py-2 text-sm tab-active" data-tab="timeline">📨 消息时间线</button>
          <button class="tab-btn px-4 py-2 text-sm text-gray-400 hover:text-white" data-tab="traces">🔍 消息追踪</button>
        </div>

        <!-- 消息时间线 -->
        <div id="tab-timeline" class="tab-content">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-gray-500">显示最近消息</span>
            <label class="text-xs flex items-center">
              <input type="checkbox" id="showRaw" class="mr-1"> 显示原始数据
            </label>
          </div>
          <div id="timeline" class="space-y-3 h-[560px] overflow-y-auto pr-2">
            <p class="text-gray-500 text-center py-8">等待消息...</p>
          </div>
        </div>

        <!-- 消息追踪列表 -->
        <div id="tab-traces" class="tab-content hidden">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-gray-500">点击查看事件详情</span>
            <button id="refreshTraces" class="text-xs px-2 py-1 bg-gray-700 rounded hover:bg-gray-600">刷新</button>
          </div>
          <div id="traceList" class="space-y-2 h-[560px] overflow-y-auto pr-2">
            <p class="text-gray-500 text-center py-8">加载追踪数据...</p>
          </div>
        </div>
      </div>

      <!-- 右侧：追踪详情 / 系统日志 -->
      <div class="lg:col-span-1 space-y-4">
        <!-- 追踪详情面板 -->
        <div id="traceDetail" class="bg-gray-800 rounded-lg p-4 hidden">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold text-sm">📋 追踪详情</h2>
            <button id="closeTraceDetail" class="text-xs text-gray-400 hover:text-white">✕</button>
          </div>
          <div id="traceDetailContent" class="text-xs space-y-2">
            <!-- 动态填充 -->
          </div>
        </div>

        <!-- 系统日志 -->
        <div class="bg-gray-800 rounded-lg p-4">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold">📋 系统日志</h2>
            <button id="clearLogs" class="text-xs px-2 py-1 bg-gray-700 rounded hover:bg-gray-600">清空</button>
          </div>
          <div class="flex flex-wrap gap-1 mb-2 text-xs">
            <label class="flex items-center bg-gray-700 px-2 py-1 rounded"><input type="checkbox" id="filterWs" checked class="mr-1">WS</label>
            <label class="flex items-center bg-gray-700 px-2 py-1 rounded"><input type="checkbox" id="filterMsg" checked class="mr-1">消息</label>
            <label class="flex items-center bg-gray-700 px-2 py-1 rounded"><input type="checkbox" id="filterErr" checked class="mr-1">错误</label>
            <label class="flex items-center bg-gray-700 px-2 py-1 rounded"><input type="checkbox" id="filterSys" checked class="mr-1">系统</label>
          </div>
          <div id="logPanel" class="h-[400px] overflow-y-auto text-xs space-y-1 pr-2">
            <p class="text-gray-500">等待日志...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DOM 元素
    const timeline = document.getElementById('timeline');
    const traceList = document.getElementById('traceList');
    const traceDetail = document.getElementById('traceDetail');
    const traceDetailContent = document.getElementById('traceDetailContent');
    const logPanel = document.getElementById('logPanel');
    const agentList = document.getElementById('agentList');

    // 状态
    let ws = null;
    let sessionMsgCount = 0;
    let agents = {};
    let messages = [];
    let logs = [];
    let traces = [];
    let adminToken = '';

    // 事件类型映射
    const EVENT_TYPE_LABELS = {
      'message_created': { label: '消息创建', color: 'bg-blue-500', icon: '📝' },
      'content_generated': { label: '内容生成', color: 'bg-purple-500', icon: '🤖' },
      'send_attempted': { label: '尝试发送', color: 'bg-yellow-500', icon: '📤' },
      'send_success': { label: '发送成功', color: 'bg-green-500', icon: '✅' },
      'server_received': { label: '服务端接收', color: 'bg-cyan-500', icon: '📥' },
      'server_broadcast': { label: '服务端广播', color: 'bg-indigo-500', icon: '📢' },
      'server_forward_agent': { label: '转发给Agent', color: 'bg-pink-500', icon: '➡️' },
      'frontend_rendered': { label: '前端渲染', color: 'bg-green-400', icon: '🖥️' },
      'client_received': { label: '客户端接收', color: 'bg-teal-500', icon: '📱' },
      'agent_received': { label: 'Agent接收', color: 'bg-violet-500', icon: '🤖' },
      'agent_processing': { label: 'Agent处理中', color: 'bg-orange-500', icon: '⚙️' },
      'agent_response_ready': { label: 'Agent响应就绪', color: 'bg-emerald-500', icon: '💬' },
      'error': { label: '错误', color: 'bg-red-500', icon: '❌' },
      'timeout': { label: '超时', color: 'bg-red-400', icon: '⏰' },
      'retry': { label: '重试', color: 'bg-amber-500', icon: '🔄' }
    };

    // 日志函数
    function log(type, message, detail = null) {
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const ms = String(Date.now() % 1000).padStart(3, '0');

      const entry = { type, message, detail, time: `${time}.${ms}` };
      logs.push(entry);
      if (logs.length > 200) logs.shift();

      const colors = {
        info: 'log-info', success: 'log-success', warning: 'log-warning',
        error: 'log-error', agent: 'log-agent', user: 'log-user',
        ws: 'log-ws', system: 'log-system'
      };

      const div = document.createElement('div');
      div.className = `log-entry ${colors[type] || 'log-info'}`;
      div.dataset.type = type;
      div.innerHTML = `<span class="text-gray-500">[${entry.time}]</span> ${message}`;
      if (detail) {
        div.innerHTML += `<br><pre class="text-gray-500 ml-4 text-xs">${escapeHtml(typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2))}</pre>`;
      }

      logPanel.appendChild(div);
      logPanel.scrollTop = logPanel.scrollHeight;

      while (logPanel.children.length > 200) {
        logPanel.removeChild(logPanel.firstChild);
      }

      applyFilters();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function applyFilters() {
      const filters = {
        ws: document.getElementById('filterWs').checked,
        msg: document.getElementById('filterMsg').checked,
        err: document.getElementById('filterErr').checked,
        sys: document.getElementById('filterSys').checked
      };
      const typeMap = { ws: 'ws', agent: 'msg', user: 'msg', error: 'err', system: 'sys', info: 'sys', success: 'sys', warning: 'err' };
      logPanel.querySelectorAll('.log-entry').forEach(el => {
        const type = el.dataset.type;
        const category = typeMap[type] || 'sys';
        el.style.display = filters[category] ? 'block' : 'none';
      });
    }

    // 更新连接状态
    function updateConnection(status, connected = false) {
      const indicator = document.querySelector('#connectionIndicator span:first-child');
      const text = document.getElementById('connectionText');
      text.textContent = status;
      indicator.className = `w-2 h-2 rounded-full mr-2 ${connected ? 'bg-green-500 pulse' : 'bg-red-500'}`;
    }

    // 格式化时间显示
    function formatTime(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(' ');
      if (parts.length >= 2) {
        return parts[1].substring(0, 5);
      }
      return timeStr;
    }

    // 格式化时间戳
    function formatTimestamp(ts) {
      const date = new Date(ts);
      return date.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(ts % 1000).padStart(3, '0');
    }

    // 添加消息到时间线
    function addMessage(msg, isHistory = false) {
      if (timeline.querySelector('.text-gray-500')) {
        timeline.innerHTML = '';
      }

      const isAgent = msg.sender_type === 'agent';
      const isSystem = msg.sender_type === 'system';
      const time = formatTime(msg.created_at);

      const div = document.createElement('div');
      div.className = 'timeline-item relative py-2';

      let dotColor = isAgent ? 'bg-purple-500' : isSystem ? 'bg-gray-500' : 'bg-blue-500';
      let icon = isAgent ? '🤖' : isSystem ? '🔧' : '👤';
      let typeLabel = isAgent ? 'Agent' : isSystem ? '系统' : '用户';

      // 显示 trace_id
      const traceIdHtml = msg.trace_id ?
        `<span class="text-xs text-cyan-400 cursor-pointer hover:underline" onclick="showTraceDetail('${msg.trace_id}')">📋 ${msg.trace_id}</span>` : '';

      div.innerHTML = `
        <div class="timeline-dot ${dotColor} top-3"></div>
        <div class="flex items-start justify-between">
          <div class="flex items-center space-x-2">
            <span>${icon}</span>
            <span class="font-medium">${escapeHtml(msg.sender_name)}</span>
            <span class="text-xs text-gray-500">${typeLabel}</span>
            ${traceIdHtml}
          </div>
          <span class="text-xs text-gray-500">${time}</span>
        </div>
        <div class="message-bubble mt-1 text-gray-300 text-sm">${escapeHtml(msg.content)}</div>
        ${document.getElementById('showRaw').checked ? `<details class="mt-2"><summary class="text-xs text-gray-500 cursor-pointer">原始数据</summary><pre class="text-xs text-gray-500 mt-1">${escapeHtml(JSON.stringify(msg, null, 2))}</pre></details>` : ''}
      `;

      timeline.appendChild(div);
      timeline.scrollTop = timeline.scrollHeight;

      messages.push(msg);
      if (messages.length > 100) messages.shift();

      sessionMsgCount++;
      document.getElementById('sessionMsgCount').textContent = sessionMsgCount;
    }

    // 更新 Agent 列表
    function updateAgentList(agentData) {
      if (!agentData || agentData.length === 0) {
        agentList.innerHTML = '<p class="text-gray-500">暂无配置的 Agent</p>';
        return;
      }

      agentList.innerHTML = agentData.map(a => {
        const isOnline = a.status === 'online';
        return `
          <div class="flex items-center justify-between p-2 bg-gray-700 rounded">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-green-500' : 'bg-gray-500'}"></span>
              <span class="text-sm">${escapeHtml(a.name)}</span>
            </div>
            <span class="text-xs ${isOnline ? 'text-green-400' : 'text-gray-500'}">${isOnline ? '在线' : '离线'}</span>
          </div>
        `;
      }).join('');
    }

    // 加载追踪数据
    async function loadTraces() {
      try {
        const headers = adminToken ? { 'x-admin-token': adminToken } : {};
        const res = await fetch('/api/debug/traces?limit=50', { headers });
        const data = await res.json();
        if (data.success && data.traces) {
          traces = data.traces;
          renderTraceList();
          document.getElementById('traceCount').textContent = traces.length;
        }
      } catch (e) {
        log('error', '加载追踪数据失败', e.message);
      }
    }

    // 渲染追踪列表
    function renderTraceList() {
      if (traces.length === 0) {
        traceList.innerHTML = '<p class="text-gray-500 text-center py-8">暂无追踪数据</p>';
        return;
      }

      traceList.innerHTML = traces.map(t => {
        const senderIcon = t.metadata?.sender_type === 'agent' ? '🤖' :
                          t.metadata?.sender_type === 'system' ? '🔧' : '👤';
        const lastEventInfo = EVENT_TYPE_LABELS[t.last_event] || { label: t.last_event, icon: '📌' };

        return `
          <div class="trace-item p-3 bg-gray-700 rounded cursor-pointer" onclick="showTraceDetail('${t.trace_id}')">
            <div class="flex justify-between items-start">
              <div class="flex items-center space-x-2">
                <span>${senderIcon}</span>
                <span class="text-sm font-medium">${escapeHtml(t.metadata?.sender_name || 'Unknown')}</span>
              </div>
              <span class="text-xs text-gray-500">${formatTimestamp(t.created_at)}</span>
            </div>
            <div class="mt-1 flex items-center justify-between">
              <span class="text-xs text-gray-400">msg:${t.message_id}</span>
              <span class="text-xs">${lastEventInfo.icon} ${lastEventInfo.label}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // 显示追踪详情
    async function showTraceDetail(traceId) {
      try {
        const headers = adminToken ? { 'x-admin-token': adminToken } : {};
        const res = await fetch(`/api/debug/traces/${traceId}`, { headers });
        const data = await res.json();
        if (!data.success || !data.trace) {
          log('error', '获取追踪详情失败');
          return;
        }

        const trace = data.trace;
        traceDetail.classList.remove('hidden');

        // 渲染事件时间线
        const eventsHtml = trace.events.map((e, idx) => {
          const info = EVENT_TYPE_LABELS[e.type] || { label: e.type, color: 'bg-gray-500', icon: '📌' };
          const time = formatTimestamp(e.timestamp);
          const duration = idx > 0 ? `+${e.timestamp - trace.events[idx-1].timestamp}ms` : '';

          return `
            <div class="flex items-start space-x-2 py-1">
              <div class="event-dot ${info.color} mt-1.5"></div>
              <div class="flex-1">
                <div class="flex justify-between">
                  <span class="text-gray-300">${info.icon} ${info.label}</span>
                  <span class="text-gray-500">${time} ${duration}</span>
                </div>
                ${e.details ? `<pre class="text-gray-500 text-xs mt-1">${escapeHtml(JSON.stringify(e.details, null, 2))}</pre>` : ''}
              </div>
            </div>
          `;
        }).join('');

        traceDetailContent.innerHTML = `
          <div class="bg-gray-700 p-2 rounded mb-2">
            <div class="text-cyan-400 font-mono text-xs">${traceId}</div>
            <div class="text-gray-400 text-xs mt-1">
              消息ID: ${trace.message_id} | 事件数: ${trace.events.length}
            </div>
          </div>
          <div class="event-timeline pl-3">
            ${eventsHtml || '<p class="text-gray-500">暂无事件</p>'}
          </div>
        `;

        log('info', `查看追踪: ${traceId}`);
      } catch (e) {
        log('error', '获取追踪详情失败', e.message);
      }
    }

    // 清空追踪记录
    async function clearTraces() {
      if (!confirm('确定要清空所有追踪记录吗？')) return;
      try {
        const headers = adminToken ? { 'x-admin-token': adminToken } : {};
        const res = await fetch('/api/debug/traces', { method: 'DELETE', headers });
        const data = await res.json();
        if (data.success) {
          log('success', '追踪记录已清空');
          traces = [];
          renderTraceList();
          document.getElementById('traceCount').textContent = '0';
        }
      } catch (e) {
        log('error', '清空失败', e.message);
      }
    }

    // WebSocket 连接
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${protocol}//${window.location.host}`;

      log('ws', `连接到 ${url}`);
      updateConnection('连接中...', false);

      ws = new WebSocket(url);

      ws.onopen = () => {
        log('success', 'WebSocket 已连接');
        updateConnection('已连接', true);

        ws.send(JSON.stringify({ type: 'debug_join', payload: {} }));
        log('ws', '发送 debug_join');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleMessage(data);
        } catch (e) {
          log('error', '解析消息失败', event.data);
        }
      };

      ws.onclose = (e) => {
        log('warning', `连接断开 code=${e.code}`);
        updateConnection('已断开', false);
      };

      ws.onerror = () => {
        log('error', 'WebSocket 错误');
        updateConnection('错误', false);
      };
    }

    // 处理消息
    function handleMessage(data) {
      const { type, payload } = data;

      switch (type) {
        case 'debug_join_ack':
          log('success', '调试模式已连接', payload);
          break;

        case 'history':
          log('info', `历史消息: ${payload.messages?.length || 0} 条`);
          if (payload.messages) {
            payload.messages.forEach(m => addMessage(m, true));
          }
          break;

        case 'message':
          const icon = payload.sender_type === 'agent' ? '🤖' : payload.sender_type === 'system' ? '🔧' : '👤';
          log(payload.sender_type === 'agent' ? 'agent' : 'user', `${icon} ${payload.sender_name}: ${payload.content}`);
          addMessage(payload);
          // 刷新追踪列表
          setTimeout(loadTraces, 100);
          break;

        case 'agent_list':
          agents = {};
          payload.agents?.forEach(a => agents[a.id] = a);
          updateAgentList(payload.agents);
          break;

        case 'agent_status':
          log('agent', `${payload.status === 'online' ? '🟢' : '🔴'} ${payload.name} ${payload.status}`);
          break;

        case 'user_list':
          document.getElementById('userCount') && (document.getElementById('userCount').textContent = payload.users?.length || 0);
          break;

        case 'error':
          log('error', `服务器错误: ${payload.message}`);
          break;

        default:
          log('system', `收到: ${type}`, payload);
      }
    }

    // 发送测试消息
    function sendTest(content) {
      if (!content) {
        content = document.getElementById('testInput').value.trim();
      }
      if (!content) return log('warning', '请输入消息内容');
      if (!ws || ws.readyState !== 1) return log('error', 'WebSocket 未连接');

      ws.send(JSON.stringify({ type: 'message', payload: { content } }));
      log('ws', `发送: ${content}`);
      document.getElementById('testInput').value = '';
    }

    // 加载统计
    async function loadStats() {
      try {
        const res = await fetch('/api/messages/stats');
        const data = await res.json();
        if (data.stats) {
          document.getElementById('totalMsgCount').textContent = data.stats.total || 0;
          document.getElementById('humanMsgCount').textContent = data.stats.byType?.human || 0;
          document.getElementById('agentMsgCount').textContent = data.stats.byType?.agent || 0;
        }
      } catch (e) {
        // 静默失败
      }
    }

    // 加载 Agent 列表
    async function loadAgents() {
      try {
        const res = await fetch('/api/agents');
        const data = await res.json();
        if (data.agents) {
          updateAgentList(data.agents);
          data.agents.forEach(a => agents[a.id] = a);
        }
      } catch (e) {
        log('error', '获取 Agent 列表失败');
      }
    }

    // 标签页切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('tab-active');
          b.classList.add('text-gray-400');
        });
        btn.classList.add('tab-active');
        btn.classList.remove('text-gray-400');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');

        if (btn.dataset.tab === 'traces') {
          loadTraces();
        }
      };
    });

    // 事件绑定
    document.getElementById('sendTest').onclick = () => sendTest();
    document.getElementById('testInput').onkeypress = (e) => e.key === 'Enter' && sendTest();
    document.getElementById('testHello').onclick = () => sendTest('你好');
    document.getElementById('testPing').onclick = () => sendTest('ping');
    document.getElementById('clearTraces').onclick = clearTraces;
    document.getElementById('reconnect').onclick = () => { if (ws) ws.close(); setTimeout(connect, 500); };
    document.getElementById('refreshAgents').onclick = loadAgents;
    document.getElementById('refreshTraces').onclick = loadTraces;
    document.getElementById('closeTraceDetail').onclick = () => traceDetail.classList.add('hidden');
    document.getElementById('clearLogs').onclick = () => {
      logPanel.innerHTML = '<p class="text-gray-500">日志已清空</p>';
      logs = [];
    };
    document.getElementById('showRaw').onchange = () => {
      const msgs = [...messages];
      timeline.innerHTML = '';
      if (msgs.length === 0) {
        timeline.innerHTML = '<p class="text-gray-500 text-center py-8">等待消息...</p>';
      } else {
        msgs.forEach(m => addMessage(m, true));
      }
    };

    // 过滤器
    ['filterWs', 'filterMsg', 'filterErr', 'filterSys'].forEach(id => {
      document.getElementById(id).onchange = applyFilters;
    });

    // 启动
    log('system', '可观测性控制台已启动');
    connect();
    loadAgents();
    loadStats();
    loadTraces();

    // 定时刷新
    setInterval(loadAgents, 10000);
    setInterval(loadStats, 5000);
    setInterval(() => {
      if (!document.getElementById('tab-traces').classList.contains('hidden')) {
        loadTraces();
      }
    }, 3000);
  </script>
</body>
</html>
